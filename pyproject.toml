[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imhungry"
version = "0.1.0"
description = "ImHungry nutrition backend with FastAPI and Strands"
requires-python = ">=3.12,<3.13"
dependencies = [
    "botocore[crt]>=1.34.0",
    "strands-agents==1.55.1",
    "boto3>=1.43.93,<2",
    "pydantic>=2.13.5,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "PyJWT[crypto]>=2.10,<3",
]

[project.scripts]
imhungry = "main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27,<1",
    "moto[dynamodb,s3]>=5,<6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["agent", "main"]

[tool.setuptools.packages.find]
where = ["src"]
