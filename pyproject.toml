[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imhungry"
version = "0.1.0"
description = "Milestone 1: a minimal Strands-based AI dietitian"
requires-python = ">=3.12,<3.13"
dependencies = [
    "botocore[crt]>=1.34.0",
    "strands-agents>=1.0.0,<2.0.0",
]

[project.scripts]
imhungry = "main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["agent", "main"]

[tool.setuptools.packages.find]
where = ["src"]
